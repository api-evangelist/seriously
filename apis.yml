description: 'Seriously Digital Entertainment is a mobile game studio best known for the Best Fiends
  match-3 puzzle franchise, a bug-versus-slug adventure set in the world of Minutia and available on
  iOS and Android. Founded in Helsinki with a Los Angeles presence and backed by Northzone, the studio
  was acquired by Playtika. It is a consumer entertainment company: its public web presence (seriously.com,
  which now redirects to bestfiends.com) is a game marketing and community site with app-store download
  links and social channels. Seriously publishes no public API, developer portal, SDK, or documentation
  surface, so this API Evangelist profile carries company identity and a domain-security probe only.'
